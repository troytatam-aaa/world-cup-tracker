<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in Outlook</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f4;color:#1b1f1d;font:16px/1.5 system-ui,Segoe UI,sans-serif}
main{max-width:440px;padding:32px;text-align:center}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 0 18px;color:#4a524e}
a.btn{display:inline-block;padding:12px 22px;border-radius:8px;background:#0f6cbd;color:#fff;text-decoration:none;font-weight:600}
small{display:block;margin-top:18px;color:#6b736f}
</style>
</head>
<body>
<main>
<h1 id="h">Opening the email in Outlook…</h1>
<p id="p">If Edge asks to open Outlook, tick “Always allow” and choose Open.</p>
<a class="btn" id="b" href="#">Open in Outlook</a>
<small>Desk Mate helper. The email ID stays in this tab and is never sent to the web server. You can close this tab once Outlook opens.</small>
</main>
<script>
{
  const hex = (location.hash || '').slice(1).toUpperCase();
  const b = document.getElementById('b');
  if (/^[0-9A-F]{40,600}$/.test(hex)) {
    b.href = 'outlook:' + hex;
    setTimeout(() => { location.href = 'outlook:' + hex; }, 150);
  } else {
    document.getElementById('h').textContent = 'No email link found';
    document.getElementById('p').textContent = 'Open this page from Desk Mate’s “Open in Outlook” link.';
    b.hidden = true;
  }
}
</script>
</body>
</html>
