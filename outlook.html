<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in Outlook</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f4;color:#1b1f1d;font:16px/1.5 system-ui,Segoe UI,sans-serif}
main{max-width:460px;padding:32px;text-align:center}
h1{font-size:22px;margin:0 0 8px}
p{margin:0 0 18px;color:#4a524e}
.btn{display:inline-block;padding:12px 22px;border-radius:8px;border:0;background:#0f6cbd;color:#fff;text-decoration:none;font:600 16px system-ui,Segoe UI,sans-serif;cursor:pointer}
.alt{display:block;margin:18px auto 0;padding:10px 16px;border-radius:8px;border:1px solid #9aa39f;background:#fff;color:#1b1f1d;font:15px system-ui,Segoe UI,sans-serif;cursor:pointer}
[hidden]{display:none!important}
small{display:block;margin-top:18px;color:#6b736f}
</style>
</head>
<body>
<main>
<h1 id="h">Opening the email in Outlook…</h1>
<p id="p">If your browser asks to open Outlook, tick “Always allow” and choose Open.</p>
<a class="btn" id="b" href="#">Open in Outlook</a>
<button class="alt" id="auto" type="button" hidden>Outlook opened – close this tab automatically from now on</button>
<small id="s">DeskMate helper. The email ID stays in this tab and is never sent to the web server.</small>
</main>
<script>
{
  const hex = (location.hash || '').slice(1).toUpperCase();
  const $ = id => document.getElementById(id);
  const KEY = 'dm-autoclose';
  const get = () => { try { return localStorage.getItem(KEY) === '1'; } catch (_) { return false; } };
  const set = () => { try { localStorage.setItem(KEY, '1'); } catch (_) {} };
  const closeTab = () => {
    window.close();
    // Some browsers refuse; tell the user instead of leaving them guessing.
    setTimeout(() => {
      $('h').textContent = 'Done – you can close this tab';
      $('p').textContent = 'Your browser didn’t let this page close itself (Ctrl+W closes it).';
    }, 700);
  };

  if (/^[0-9A-F]{40,600}$/.test(hex)) {
    const url = 'outlook:' + hex;
    $('b').href = url;
    setTimeout(() => { location.href = url; }, 150);
    if (get()) {
      // "Always allow" is already set, so there is no prompt to wait for.
      $('s').textContent = 'This tab closes itself in a moment.';
      setTimeout(closeTab, 1500);
    } else {
      // First time: wait for the browser prompt to be answered, then let the user switch on auto-close.
      $('auto').hidden = false;
      $('auto').onclick = () => { set(); closeTab(); };
    }
  } else {
    $('h').textContent = 'No email link found';
    $('p').textContent = 'Open this page from DeskMate’s “Open in Outlook” link.';
    $('b').hidden = true;
  }
}
</script>
</body>
</html>
